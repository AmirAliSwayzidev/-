# کپی این فایل به:
# .github/workflows/build-apk.yml
# در ریشه ریپو (جایی که پوشه PlanoraAI هست)

name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Android SDK env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: SDK packages
        run: |
          SDK=/usr/local/lib/android/sdk
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle wrapper
        working-directory: PlanoraAI
        run: |
          if [ ! -f gradlew ]; then
            curl -fsSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q /tmp/g.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: Assemble Debug
        working-directory: PlanoraAI
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PlanoraAI-debug
          path: PlanoraAI/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
